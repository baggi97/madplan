# Synology Container Manager → Project. Kører kun Madplan.
#
# Tunnelen udefra og den automatiske opdatering ligger i
# docker-compose.infra.yml, fordi de betjener flere containere end denne.
# Den skal være startet først — den opretter ikke proxy-netværket.
#
# Websitet efter deploy:  http://<NAS-IP>:8099
#
# Kør altid fra mappen med filen — .env findes relativt:
#   cd /volume1/docker/madplan && sudo docker-compose -f docker-compose.synology.yml up -d
#
# Alt bor i /volume1/docker/madplan på NAS'en:
#   /volume1/docker/madplan/.env                      ANTHROPIC_API_KEY=sk-ant-...
#   /volume1/docker/madplan/config/praeferencer.yaml  husstandens smag
#   /volume1/docker/madplan/data/                     ugerne og historikken
services:
  madplan:
    image: ghcr.io/baggi97/madplan:latest
    container_name: madplan
    restart: unless-stopped
    # Bevidst IKKE env_file. Compose indlæser selv .env fra mappen ved siden
    # af compose-filen til variabel-substitution, og på DSM's Compose v1 nåede
    # env_file ikke ind i containeren. Her læses værdierne direkte i stedet,
    # med fornuftige standarder hvis de ikke står i .env.
    #
    # VIGTIGT: listen er udtømmende. Tilføjer du en ny indstilling i
    # config.py, skal den også med her — ellers når den aldrig frem, og
    # funktionen ser bare ud til ikke at virke.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      TZ: ${TZ:-Europe/Copenhagen}
      FORSLAG_CRON: ${FORSLAG_CRON:-sun 8}
      DEADLINE_CRON: ${DEADLINE_CRON:-sun 18}
      PAAMINDELSE_CRON: ${PAAMINDELSE_CRON:-sun 17}
      ANTAL_FORSLAG: ${ANTAL_FORSLAG:-10}
      ANTAL_RETTER: ${ANTAL_RETTER:-5}
      ANTAL_MED_TILBUD: ${ANTAL_MED_TILBUD:-5}
      UNDGAA_UGER: ${UNDGAA_UGER:-4}
      GENTAGELSE_GRAENSE: ${GENTAGELSE_GRAENSE:-0.72}
      # Push. Tomme nøgler slår det fra, så feltet må gerne stå tomt.
      VAPID_OFFENTLIG_NOEGLE: ${VAPID_OFFENTLIG_NOEGLE:-}
      VAPID_PRIVAT_NOEGLE: ${VAPID_PRIVAT_NOEGLE:-}
      VAPID_KONTAKT: ${VAPID_KONTAKT:-mailto:madplan@eksempel.dk}
      # Containeren lytter altid på 8099 — porten mappes udefra herunder
      DATA_DIR: /data
      CONFIG_DIR: /config
    # Giver adgang direkte på NAS'ens IP fra dit eget netværk. Det er en
    # fin reservevej hvis tunnelen er nede — og porten er kun åben på LAN'et,
    # ikke mod internettet. Vil du have at NAS'en intet eksponerer, kan de to
    # linjer slettes; så går al adgang gennem tunnelen.
    ports:
      - "8099:8099"
    volumes:
      # Ugerne og historikken skal overleve en opdatering
      - /volume1/docker/madplan/data:/data
      # Præferencerne redigeres på NAS'en, ikke i imaget
      - /volume1/docker/madplan/config:/config
    labels:
      # Watchtower kører i docker-compose.infra.yml og opdaterer kun
      # containere med denne label.
      - com.centurylinklabs.watchtower.enable=true
    networks:
      # Delt med cloudflared, så tunnelen kan nå madplan:8099 ved navn uden
      # at gå om NAS'ens IP.
      - proxy

networks:
  proxy:
    external: true
